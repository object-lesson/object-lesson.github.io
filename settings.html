<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Settings | Unblocked Games 2026</title>
  <meta name="description" content="Customize your experience on Unblocked Games 2026."/>
  <link rel="icon" type="image/png" href="assets/img/logo.png"/>
  <link rel="stylesheet" href="assets/css/style.css?7ss"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/" class="brand-link">Unblocked Games 2026</a>
    </div>
    <nav id="main-nav" class="main-nav">
      <a href="/">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="settings.html">Settings</a>
    </nav>
  </header>

  <main class="wrap" style="max-width:1200px;margin:0 auto;padding:18px;">
    <h1 style="margin:10px 0 14px;">Settings</h1>

    <div class="seo-article">
      <h2>New Tab Mode</h2>
      <p>Choose how <strong>Open in New Tab</strong> behaves on game pages.</p>
      <label style="display:flex;gap:10px;align-items:center;margin:10px 0;">
        <input type="checkbox" id="cloakToggle"/>
        <span>Use about:blank cloak (hide the game URL)</span>
      </label>

      <h2>Theme</h2>
      <p>Switch between light and dark mode.</p>
      <label style="display:flex;gap:10px;align-items:center;margin:10px 0;">
        <input type="checkbox" id="darkToggle"/>
        <span>Enable dark mode</span>
      </label>

      <h2>Reset</h2>
      <button id="resetBtn" class="button" style="width:auto;">Reset Settings</button>
    </div>
  </main>

  <script src="assets/js/site_settings.js"></script>
  <script>
    (function(){
      var cloak = document.getElementById('cloakToggle');
      var dark = document.getElementById('darkToggle');
      var reset = document.getElementById('resetBtn');

      function sync(){
        cloak.checked = !!UG2026.get('ug2026_cloak', true);
        dark.checked = (UG2026.get('ug2026_theme','light') === 'dark');
      }
      cloak.addEventListener('change', function(){ UG2026.set('ug2026_cloak', cloak.checked); });
      dark.addEventListener('change', function(){ UG2026.set('ug2026_theme', dark.checked ? 'dark' : 'light'); });
      reset.addEventListener('click', function(){
        try{
          localStorage.removeItem('ug2026_cloak');
          localStorage.removeItem('ug2026_theme');
        }catch(e){}
        sync();
        location.reload();
      });
      sync();
    })();
  </script>
</body>
</html>
